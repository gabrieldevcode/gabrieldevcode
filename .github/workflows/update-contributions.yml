name: Atualiza os assets do perfil

# O retrato e o rodape sao estaticos (so mudam quando a foto ou a frase mudam).
# O que vive sao o grafico de contribuicoes, os numeros e os cards de projeto.
"on":
  schedule:
    - cron: "17 6 * * *"      # ~03:17 no horario de Brasilia
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch_*.py"
      - "scripts/render_*.py"
      - "scripts/theme.py"
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # O contexto `secrets` nao existe dentro de `if:` de step - so `env`.
      # Por isso o segredo e promovido a variavel de ambiente aqui em cima.
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala as dependencias
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Baixa o calendario publico de contribuicoes
        run: python scripts/fetch_contributions.py ${{ github.repository_owner }}

      - name: Redesenha o grafico
        run: python scripts/render_heatmap_svg.py

      - name: Atualiza os cards de projeto
        run: |
          python scripts/fetch_projects.py ${{ github.repository_owner }}
          python scripts/render_projects_svg.py

      # O GITHUB_TOKEN padrao so enxerga ESTE repositorio, entao /user/repos
      # devolveria so os publicos: o cartao perderia metade dos projetos e a
      # GraphQL nao entregaria commits totais. Sem um PAT pessoal em
      # secrets.GH_TOKEN este passo e pulado e fica o ultimo cartao commitado,
      # que esta correto.
      - name: Recalcula numeros e linguagens
        if: env.GH_TOKEN != ''
        run: |
          python scripts/fetch_stats.py ${{ github.repository_owner }}
          python scripts/render_stats_svg.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza os assets do perfil [skip ci]"
          file_pattern: "data/*.json assets/*.svg assets/projects/*.svg"
