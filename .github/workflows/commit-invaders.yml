name: commit-invaders

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # GH_TOKEN = Personal Access Token (classic) com escopo read:user.
      # O GITHUB_TOKEN padrao costuma NAO conseguir ler o contributionsCollection
      # na GraphQL, que e de onde vem o grafico. Sem GH_TOKEN, cai no padrao.
      - uses: Goblinlordx/commit-invaders@v1
        with:
          github_token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          github_user_name: ${{ github.repository_owner }}
