<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Gabriel - Electronic and Computer Engineering">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070B10"/>
    <stop offset="55%" stop-color="#0B1119"/>
    <stop offset="100%" stop-color="#060A0E"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0"/>
    <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2DD4BF"/>
    <stop offset="70%" stop-color="#38BDF8"/>
    <stop offset="100%" stop-color="#F5A524"/>
  </linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#16232E" stroke-width="1"/>
  </pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000000" opacity="0.22"/>
  </pattern>
  <clipPath id="frame"><rect x="0" y="0" width="900" height="280" rx="14"/></clipPath>

  <style>
    .mono { font-family: "SFMono-Regular", "JetBrains Mono", "Consolas", "Courier New", monospace; }
    .dim  { fill:#4C5C6B; }
    .tealc{ fill:#2DD4BF; }
    .amber{ fill:#F5A524; }
    .white{ fill:#D6E2EC; }

    .l { opacity:0; animation: pop .01s linear forwards; }
    @keyframes pop { to { opacity:1 } }
    .l1{ animation-delay:.35s } .l2{ animation-delay:.75s } .l3{ animation-delay:1.15s }
    .l4{ animation-delay:1.55s } .l5{ animation-delay:1.95s } .l6{ animation-delay:2.45s }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .title { animation: reveal 3.2s ease-out both; }
    @keyframes reveal { 0%{ opacity:0; letter-spacing:18px } 60%{ opacity:1 } 100%{ opacity:1; letter-spacing:2px } }

    .gr { opacity:0; animation: glitch 7s steps(1) infinite; }
    @keyframes glitch {
      0%,88%,100% { transform: translate(0,0); opacity:0 }
      89% { transform: translate(-3px,1px); opacity:.85 }
      90% { transform: translate(2px,-1px); opacity:.55 }
      91% { transform: translate(-1px,0); opacity:.75 }
      92% { transform: translate(0,0); opacity:0 }
    }
    .gb { opacity:0; animation: glitchb 7s steps(1) infinite; }
    @keyframes glitchb {
      0%,88%,100% { transform: translate(0,0); opacity:0 }
      89% { transform: translate(3px,-1px); opacity:.7 }
      90% { transform: translate(-2px,1px); opacity:.5 }
      91% { transform: translate(1px,0); opacity:.6 }
      92% { transform: translate(0,0); opacity:0 }
    }

    .sweepbar { animation: fall 5.5s linear infinite; }
    @keyframes fall { 0%{ transform: translateY(-70px) } 100%{ transform: translateY(300px) } }

    .trace { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 4s linear infinite; }
    @keyframes draw { 0%{ stroke-dashoffset:1200 } 70%,100%{ stroke-dashoffset:0 } }

    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{ opacity:.25 } 50%{ opacity:1 } }

    .led1 { animation: led 2.4s ease-in-out infinite }
    .led2 { animation: led 2.4s ease-in-out infinite .6s }
    .led3 { animation: led 2.4s ease-in-out infinite 1.2s }
    @keyframes led { 0%,100%{ opacity:.15 } 50%{ opacity:1 } }

    .bar { animation: load 3s ease-out both .9s }
    @keyframes load { 0%{ width:0 } 100%{ width:150px } }
  </style>
</defs>

<g clip-path="url(#frame)">
  <rect width="900" height="280" fill="url(#bg)"/>
  <rect width="900" height="280" fill="url(#grid)" opacity="0.55"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#1B2A36" stroke-width="1.5">
    <path d="M0 232 H120 L140 212 H300"/>
    <path d="M900 48 H760 L740 68 H600"/>
    <path d="M0 60 H60 L80 40 H210"/>
  </g>
  <g fill="#2DD4BF" opacity="0.5">
    <circle cx="140" cy="212" r="2.5"/><circle cx="740" cy="68" r="2.5"/><circle cx="80" cy="40" r="2.5"/>
  </g>

  <!-- terminal block -->
  <g class="mono" font-size="12">
    <text x="42" y="52" class="l l1 dim">gabriel@poli-ufrj:~$ <tspan class="tealc">./boot --profile</tspan></text>
    <text x="42" y="72" class="l l2 dim">[ <tspan class="tealc">ok</tspan> ] mounting /dev/embedded ......... ESP32-S3, RP2040, STM32</text>
    <text x="42" y="92" class="l l3 dim">[ <tspan class="tealc">ok</tspan> ] loading agents ................. claude-code, MCP servers</text>
    <text x="42" y="112" class="l l4 dim">[ <tspan class="amber">..</tspan> ] linking research .............. LCA / openLCA / TinyML</text>
  </g>

  <!-- loading bar -->
  <g class="l l4">
    <rect x="42" y="124" width="150" height="4" rx="2" fill="#16232E"/>
    <rect x="42" y="124" height="4" rx="2" fill="url(#wire)" class="bar"/>
  </g>

  <!-- name -->
  <g class="title">
    <text x="40" y="192" class="mono white" font-size="52" font-weight="700" letter-spacing="2">GABRIEL</text>
    <text x="40" y="192" class="mono gr" fill="#FF4D6D" font-size="52" font-weight="700" letter-spacing="2">GABRIEL</text>
    <text x="40" y="192" class="mono gb" fill="#38BDF8" font-size="52" font-weight="700" letter-spacing="2">GABRIEL</text>
  </g>

  <g class="l l6">
    <rect x="42" y="208" width="10" height="2" fill="#F5A524"/>
    <text x="60" y="214" class="mono tealc" font-size="13" letter-spacing="3">ENGENHARIA ELETRONICA E DE COMPUTACAO &#183; UFRJ</text>
    <text x="42" y="240" class="mono dim" font-size="12">embedded systems <tspan class="amber">/</tspan> AI agents <tspan class="amber">/</tspan> automation <tspan class="amber">/</tspan> applied research</text>
    <rect x="450" y="230" width="8" height="12" fill="#2DD4BF" class="cursor"/>
  </g>

  <!-- oscilloscope panel -->
  <g transform="translate(600,86)">
    <rect x="0" y="0" width="264" height="120" rx="8" fill="#080D12" stroke="#1B2A36"/>
    <g stroke="#12202B" stroke-width="1">
      <path d="M0 30H264M0 60H264M0 90H264M66 0V120M132 0V120M198 0V120"/>
    </g>
    <path class="trace" d="M4 60 C 24 60, 28 18, 44 18 S 64 60, 84 60 S 96 96, 112 96 S 132 60, 152 60 S 168 26, 184 26 S 204 60, 224 60 S 244 76, 260 60"
          fill="none" stroke="url(#wire)" stroke-width="2.2" stroke-linecap="round"/>
    <text x="10" y="16" class="mono tealc" font-size="9" letter-spacing="2">SIGNAL / COMMIT RATE</text>
    <g>
      <circle cx="228" cy="12" r="3" fill="#2DD4BF" class="led1"/>
      <circle cx="240" cy="12" r="3" fill="#F5A524" class="led2"/>
      <circle cx="252" cy="12" r="3" fill="#38BDF8" class="led3"/>
    </g>
    <text x="10" y="112" class="mono dim" font-size="9" letter-spacing="1">CH1 20mV/div</text>
    <text x="190" y="112" class="mono tealc pulse" font-size="9" letter-spacing="1">LIVE</text>
  </g>

  <!-- chip corner -->
  <g transform="translate(806,214)" opacity="0.9">
    <rect x="0" y="0" width="42" height="42" rx="4" fill="#0E161E" stroke="#2DD4BF" stroke-opacity="0.5"/>
    <g stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="2">
      <path d="M-8 10H0M-8 21H0M-8 32H0M42 10h8M42 21h8M42 32h8M10 -8V0M21 -8V0M32 -8V0M10 42v8M21 42v8M32 42v8"/>
    </g>
    <text x="21" y="26" text-anchor="middle" class="mono tealc" font-size="9" letter-spacing="1">MCU</text>
  </g>

  <!-- CRT effects -->
  <rect width="900" height="70" fill="url(#sweep)" class="sweepbar"/>
  <rect width="900" height="280" fill="url(#scan)"/>
  <rect x="0.5" y="0.5" width="899" height="279" rx="14" fill="none" stroke="#1E2E3A"/>
</g>
</svg>
