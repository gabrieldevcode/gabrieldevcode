<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Linguagens mais usadas">
<style>
  text { font-family: ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace; }
  .ttl { fill:#E6EDF3; font-size:14px; font-weight:700; letter-spacing:.4px; }
  .upd { fill:#7D8590; font-size:11.5px; }
  .nm  { fill:#E6EDF3; font-size:12.5px; }
  .pc  { fill:#7D8590; font-size:12.5px; text-anchor:end; }
  .ft  { fill:#7D8590; font-size:12px; }
  .nt  { fill:#4A535E; font-size:11px; }

  .sg { transform-box:fill-box; transform-origin:left center;
         animation: grow .8s cubic-bezier(.2,.8,.25,1) both; }
  @keyframes grow { from { transform:scaleX(0) } to { transform:scaleX(1) } }

  .lg { opacity:0; animation: fade .6s ease-out both; }
  @keyframes fade { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }

  @media (prefers-reduced-motion: reduce) {
    .sg, .lg { opacity:1 !important; animation:none !important; transform:none !important; }
  }
</style>

