<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="214" viewBox="0 0 1000 214" role="img" aria-label="Numeros e linguagens">
<style>
  text { font-family: ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .hd { fill:#22D3EE; font-size:15px; font-weight:700; letter-spacing:.3px; }
  .lb { fill:#94A3B8; font-size:13px; }
  .vl { fill:#F8FAFC; font-size:13px; font-weight:700; text-anchor:end; }
  .lg { fill:#F8FAFC; font-size:12.5px; }
  .pc { fill:#94A3B8; font-size:12.5px; text-anchor:end; }
  .nt { fill:#475569; font-size:10.5px; text-anchor:end; }

  .rw { opacity:0; animation: fade .55s ease-out both; }
  @keyframes fade { from { opacity:0; transform:translateY(7px) } to { opacity:1; transform:none } }
  .sg { transform-box:fill-box; transform-origin:left center;
         animation: grow .9s cubic-bezier(.2,.8,.25,1) both; }
  @keyframes grow { from { transform:scaleX(0) } to { transform:scaleX(1) } }

  @media (prefers-reduced-motion: reduce) {
    .rw, .sg { opacity:1 !important; animation:none !important; transform:none !important; }
  }
</style>

<rect x=".5" y=".5" width="489.0" height="213" rx="12" fill="#0C1426" stroke="#1B2942">
  <animate attributeName="stroke" values="#1B2942;#22D3EE;#1B2942" dur="6s" begin="1s" repeatCount="indefinite"/>
</rect>
<rect x="510.5" y=".5" width="489.0" height="213" rx="12" fill="#0C1426" stroke="#1B2942">
  <animate attributeName="stroke" values="#1B2942;#22D3EE;#1B2942" dur="6s" begin="3s" repeatCount="indefinite"/>
</rect>

