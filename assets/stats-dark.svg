<g class="rw" style="animation-delay:0.69s"><g stroke="#A78BFA" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(22.0 154.0)"><rect x="1.4" y="2" width="13.2" height="12" rx="2"/><path d="M4.4 2v12M1.4 6.6h3"/></g><text class="lb" x="48" y="166">Repositórios</text><text class="vl" x="468" y="166">24  (12 públicos)</text></g>

