<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Commit Invaders">
<defs>
  <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0A1017"/>
    <stop offset="100%" stop-color="#060A0E"/>
  </linearGradient>
  <clipPath id="mc"><rect width="900" height="150" rx="10"/></clipPath>
  <style>
    .mono { font-family:"SFMono-Regular","JetBrains Mono","Consolas",monospace; }
    .coin { animation: coin 2.2s ease-in-out infinite; }
    @keyframes coin { 0%,45%{opacity:1} 55%,100%{opacity:.15} }
    .march { animation: march 4s ease-in-out infinite alternate; }
    @keyframes march { 0%{transform:translateX(0)} 100%{transform:translateX(26px)} }
    .ship { animation: patrol 6s ease-in-out infinite alternate; }
    @keyframes patrol { 0%{transform:translateX(-40px)} 100%{transform:translateX(40px)} }
    .shot { animation: shot 1.6s linear infinite; }
    @keyframes shot { 0%{transform:translateY(0); opacity:0} 10%{opacity:1} 70%{transform:translateY(-46px); opacity:1} 71%,100%{transform:translateY(-46px); opacity:0} }
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 0%,100%{opacity:.55} 50%{opacity:1} }
  </style>
</defs>
<g clip-path="url(#mc)">
  <rect width="900" height="150" fill="url(#mg)"/>
  <rect x="0.5" y="0.5" width="899" height="149" rx="10" fill="none" stroke="#1E2E3A"/>

  <!-- invasores -->
  <g class="march" fill="#2DD4BF" opacity="0.85">
    <g transform="translate(70,30)">
      <path d="M2 0h2v2h2V0h2v2h2v2h2v4H0V4h2V2H0V0h2z" transform="scale(2.2)"/>
    </g>
    <g transform="translate(140,30)" opacity="0.7">
      <path d="M2 0h2v2h2V0h2v2h2v2h2v4H0V4h2V2H0V0h2z" transform="scale(2.2)"/>
    </g>
    <g transform="translate(210,30)" opacity="0.5">
      <path d="M2 0h2v2h2V0h2v2h2v2h2v4H0V4h2V2H0V0h2z" transform="scale(2.2)"/>
    </g>
  </g>
  <g class="march" fill="#F5A524" opacity="0.7">
    <g transform="translate(690,30)">
      <path d="M2 0h2v2h2V0h2v2h2v2h2v4H0V4h2V2H0V0h2z" transform="scale(2.2)"/>
    </g>
    <g transform="translate(760,30)" opacity="0.6">
      <path d="M2 0h2v2h2V0h2v2h2v2h2v4H0V4h2V2H0V0h2z" transform="scale(2.2)"/>
    </g>
  </g>

  <!-- titulo -->
  <text x="450" y="56" text-anchor="middle" class="mono" fill="#D6E2EC" font-size="26" font-weight="700" letter-spacing="6">COMMIT INVADERS</text>
  <text x="450" y="76" text-anchor="middle" class="mono glow" fill="#2DD4BF" font-size="9" letter-spacing="5">GERADO TODO DIA A PARTIR DO MEU GRÁFICO DE CONTRIBUIÇÕES</text>
  <text x="450" y="100" text-anchor="middle" class="mono coin" fill="#F5A524" font-size="10" letter-spacing="4">&#9654; INSERT COIN</text>

  <!-- navinha + tiro -->
  <g class="ship" transform="translate(432,122)">
    <rect class="shot" x="9" y="-6" width="2" height="10" fill="#F5A524"/>
    <path d="M8 0h4v3h4v3h4v3H0V6h4V3h4z" fill="#2DD4BF" transform="scale(1.2)"/>
  </g>

  <!-- base -->
  <rect x="0" y="148" width="900" height="2" fill="#2DD4BF" opacity="0.35"/>
</g>
</svg>
